<header class="relative w-full min-h-screen max-h-screen overflow-hidden">
    <!-- Container -->
    <div class="px-16 py-12">
        <!-- Title -->
        <div class="w-full">
            <h1 class="text-4xl text-center text-red-800 font-medium font-sans">Just The Two Of Us</h1>
        </div>
        
        <!-- Content -->
        <div class="flex items-start justify-between gap-12 w-full bg-gray-50">
            <!-- Vinyle -->
            <div class="p-3">
                <div class="w-32 h-32 rounded-full bg-red-50 animate spin" style="animation-duration: 6s;">
                    <!-- Overlay French Lyrics (mdr je vais vraiment essayer de traduire la chanson (en parti, faut pas déconner)) -->
                    <div class="fixed inset-0 bg-blue-50/30 flex justify-center items-center justify-start gap-2">
                        <ul class="flex flex-col items-center justify-start gap-2 p-32 py-48">
                            @if(lyricOverlay()){
                                @for(lyric of lyrics; track lyric){
                                    <li class="text-4xl font-bold font-sans">
                                        <p class="text-blue-800">{{ lyric.eng }}</p>
                                        <p class="text-red-800">{{ lyric.fr }}</p>
                                    </li>
                                }
                            }
                        </ul>
                    </div>
                </div>
                <ul class="flex flex-col justify-start gap-3">
                    <li class="flex items-center justify-start gap-2">
                        <span class="w-2 h-2 bg-gray-950"></span>
                        <p class="text-xs text-gray-800 font-medium font-sans">Just The Two Of Us</p>
                    </li>
                    <li class="flex items-center justify-start gap-2">
                        <span class="w-2 h-2 bg-gray-950"></span>
                        <p class="text-xs text-gray-800 font-medium font-sans">Daniel Glover</p>
                    </li>
                    <li class="flex items-center justify-start gap-2">
                        <span class="w-2 h-2 bg-gray-950"></span>
                        <p class="text-xs text-gray-800 font-medium font-sans">1978</p>
                    </li>
                </ul>
            </div>

            <!-- Quote -->
            <div class="w-2/3 h-full bg-red-50 px-16 py-6 rounded-lg bg-cover overflow-hidden">
                <!-- Quote Container -->
                <div class="w-full">
                    <!-- Quote Texte -->
                    <p class="text-right text-gray-800 font-sans">Contruisons un chateau d'amour dans le ciel, juste toi et moi </p>
                </div>
                
                <!-- Background Image (maybe ? or instead i'll just put as a backround-image properties in the parent style) -->
                <div></div>
            </div>
        </div>

        <!-- Slider -->
        <div>
            <!-- Slider Container -->
            <div>
                <!-- Slider Items -->
                <div></div>
            </div>
        </div>
    </div>

    <!-- Morph Background -->
    <div class="absolute inset-x-24 inset-y-0 bg-white rounded-tl-16 rounded-tr-16"></div>
</header>
