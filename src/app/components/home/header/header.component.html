<header class="relative w-full min-h-screen overflow-hidden px-24 pt-20">
    <!-- Container -->
    <div class="px-8 pt-20 pb-12 space-y-16">
        <!-- Title -->
        <div class="w-full">
            <h1 class="text-8xl text-center text-red-800 font-medium fiolexgirl">Just The Two Of Us</h1>
        </div>
        
        <!-- Content -->
        <div class="relative flex items-start justify-between w-full h-full">
            <!-- Vinyle -->
            <div class="w-1/3 p-3 space-y-6">
                <div class="group relative mx-auto w-64 h-64 rounded-full bg-radial from-gray-700 from-40% to-gray-800 flex items-center justify-center">
                    <div class="w-32 h-32 bg-gray-600 rounded-full bg-cover bg-center animate-spin group-hover:scale-110 transition-[scale] duration-800" style="animation-duration: 12s; background-image: url('images/vinyl.jpg');"></div>

                    <div class="absolute inset-0 bg-black/40 hover:opacity-100 opacity-0 rounded-full flex justify-center items-center transition duration-300 ease-in-out pointer">
                        <svg class="w-16" viewBox="0 0 84 84" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <g clip-path="url(#clip0_2022_23)">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M71.937 30.8801L24.0092 1.70624C15.9851 -3.175 6 3.00065 6 12.8273V71.1721C6 81.0115 15.9851 87.1744 24.0092 82.2932L71.937 53.134C80.0212 48.2143 80.0212 35.7997 71.937 30.8801Z" fill="white"/>
                            </g>
                            <defs>
                            <clipPath id="clip0_2022_23">
                            <rect width="84" height="84" fill="white"/>
                            </clipPath>
                            </defs>
                        </svg>
                    </div>

                    <!-- Hole -->
                    <div class="absolute w-6 h-6 top-center left-center bg-white rounded-full"></div>
                    
                </div>
                <ul class="hidden flex flex-col justify-start gap-3 mx-auto px-24">
                    <li class="flex items-center justify-start gap-2">
                        <span class="w-2 h-2 bg-gray-950"></span>
                        <p class="text-xs text-gray-800 font-medium font-sans">Just The Two Of Us</p>
                    </li>
                    <li class="flex items-center justify-start gap-2">
                        <span class="w-2 h-2 bg-gray-950"></span>
                        <p class="text-xs text-gray-800 font-medium font-sans">Daniel Glover</p>
                    </li>
                    <li class="flex items-center justify-start gap-2">
                        <span class="w-2 h-2 bg-gray-950"></span>
                        <p class="text-xs text-gray-800 font-medium font-sans">1978</p>
                    </li>
                </ul>
            </div>

            <!-- Quote -->
            <div class="relative w-2/3 h-72 px-16 py-6 rounded-lg overflow-hidden">
                <div class="absolute -z-10 inset-0 bg-cover" style="background-image: url('images/header-2.jpg')"></div>
                <div class="absolute -z-10 inset-0 bg-black/40"></div>
                <div class="absolute -z-10 inset-0 bg-blue-50/30"></div>
                
                <!-- Quote Container -->
                <div class="w-full">
                    <!-- Quote Texte -->
                    <p class="text-xl text-white text-right font-medium font-sans">Contruisons un chateau d'amour dans le ciel, <br> juste toi et moi </p>
                </div>
            </div>
        </div>

        <!-- Slider -->
        <div class="w-full h-24 px-6">
            <div class="overflow-hidden">
                <!-- Slider Container -->
                <div #slider class="w-full flex items-center justify-start gap-24 no-scrollbar transition-transform duration-500 ease-linear">
                    <!-- Slider Items -->
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media1.tenor.com/m/wqCAHtQuTnkAAAAd/milk-and-mocha-hug.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/GXol-8FjPFYAAAAj/milk-mocha-bear.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/ACxj8UaRGDIAAAAj/love.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/owSXAc8yVpAAAAAj/milk-and-mocha-kiss-cheek.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/z1N2jUKR9oMAAAAi/milk-and-mocha.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/af05gjYorTUAAAAi/milk-and-mocha.gif" alt="gif kawai">
                    </div>
                    
                    <!-- Slider Items Duplicates -->
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media1.tenor.com/m/wqCAHtQuTnkAAAAd/milk-and-mocha-hug.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/GXol-8FjPFYAAAAj/milk-mocha-bear.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/ACxj8UaRGDIAAAAj/love.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/owSXAc8yVpAAAAAj/milk-and-mocha-kiss-cheek.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/z1N2jUKR9oMAAAAi/milk-and-mocha.gif" alt="gif kawai">
                    </div>
                    <div>
                        <img class="min-w-24 h-auto rounded-xl" src="https://media.tenor.com/af05gjYorTUAAAAi/milk-and-mocha.gif" alt="gif kawai">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Morph Background -->
    <!-- 
    écouter le scroll pour changer la valeur de inset-x (pour la réduire) progressivement au fur et à mesure que l'utilisateur qui le header
    -->
    <div class="absolute -z-20 inset-x-24 top-20 bottom-0 bg-white rounded-t-3xl"></div>
    
    <!-- Cupidon Illustration -->
    <div class="absolute -z-20 top-10 left-12 w-48 h-48 bg-red-800 rounded-xl"></div>
</header>


<!-- Overlay French Lyrics (mdr je vais vraiment essayer de traduire la chanson (en parti, faut pas déconner)) -->
@if(lyricOverlay()){
<div class="fixed inset-0 bg-blue-50/30 flex justify-center items-center justify-start gap-2">
    <ul class="flex flex-col items-center justify-start gap-2 p-32 py-48">
        @for(lyric of lyrics; track lyric){
            <li class="text-4xl font-bold font-sans">
                <p class="text-blue-800">{{ lyric.eng }}</p>
                <p class="text-red-800">{{ lyric.fr }}</p>
            </li>
        }
    </ul>
</div>
}
