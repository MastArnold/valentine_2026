                </svg>

            </div>
        </div>
        <!-- Texte -->
        <div>
            <h4 class="text-8xl text-[var(--color-3)] font-bold valentine">Veux tu être ma valentine</h4>            
        </div>
        <!-- Buttons -->
        <div class="flex justify-evenly items-center gap-12 py-8">
            @for(btn of yesButtons; track btn){
            <button [ngStyle]="{ 'top': btn.top, 'left': btn.left }" class="absolute z-40 flex items-center gap-3 pointer">
                <span class="block border-8 border-[var(--color-3)] rounded-xl w-16 h-16"></span>
                <span class="text-3xl text-[var(--color-3)] font-bold font-sans uppercase">Oui</span>
            </button>
            }
            <button class="flex items-center gap-3 pointer">
                <span class="block border-8 border-[var(--color-3)] rounded-xl w-16 h-16"></span>
                <span class="text-3xl text-[var(--color-3)] font-bold font-sans uppercase">Oui</span>
            </button>
            <button [class.hidden]="!btnNoVisible" class="flex items-center gap-3 pointer" (click)="checkNo()">
                <span class="block border-8 border-[var(--color-3)] rounded-xl w-16 h-16"></span>
                <span class="text-3xl text-slate-700 font-bold font-sans uppercase">Non</span>
            </button>
        </div>
    </div>

    <div>
        <!-- Funny Valentine -->
        <div class="absolute top-12 right-0">
            <div [ngClass]="{'translate-x-0 -rotate-20': d4cVisible, 'translate-x-full -rotate-0': !d4cVisible}" class="w-48 transition-transform duration-1000">
                <img class="w-full h-auto" src="images/d4c.png" alt="d4c">
            </div>
        </div>
        
        <!-- D4C -->
        <div class="hidden absolute top-0 right-1/2">
            <div class="w-48 h-48 bg-red-800"></div>
        </div>
    </div>
</section>
